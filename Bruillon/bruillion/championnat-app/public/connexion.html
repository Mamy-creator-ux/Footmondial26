<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion — Mondial 2026</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header" id="site-header"></header>

<main class="page" style="max-width:480px;">
  <div class="section-title"><h2>Connexion</h2></div>
  <form class="form-panel" id="form-login">
    <div><label>Adresse email</label><input type="email" id="email" required></div>
    <div><label>Mot de passe</label><input type="password" id="motDePasse" required></div>
    <div class="form-error" id="login-error"></div>
    <button class="btn btn-primary" type="submit">Se connecter</button>
  </form>
  <p style="color:var(--gris); font-size:13px; margin-top:18px;">
    Pas encore de compte ? <a href="inscription.html" style="color:var(--vert-vif);">Inscrivez-vous</a>.
  </p>
  <p style="color:var(--gris); font-size:12px; margin-top:24px;">
    Démo : admin@championnat2026.com / motdepasse123
  </p>
</main>

<script src="js/api.js"></script>
<script>
renderHeader('');

document.getElementById('form-login').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errEl = document.getElementById('login-error');
  errEl.textContent = '';
  try {
    const data = await apiFetch('/auth/login', {
      method: 'POST',
      body: JSON.stringify({
        email: document.getElementById('email').value,
        motDePasse: document.getElementById('motDePasse').value
      })
    });
    localStorage.setItem('token', data.token);
    localStorage.setItem('user', JSON.stringify(data.user));
    window.location.href = 'index.html';
  } catch (err) {
    errEl.textContent = err.message;
  }
});
</script>
</body>
</html>
