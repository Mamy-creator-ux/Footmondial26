<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Détail équipe — Mondial 2026</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header" id="site-header"></header>

<main class="page">
  <div id="team-header">Chargement…</div>

  <div class="section-title" style="margin-top:36px;">
    <h2>Effectif</h2>
    <select id="filtre-poste">
      <option value="">Tous les postes</option>
      <option value="Gardien">Gardien</option>
      <option value="Défenseur">Défenseur</option>
      <option value="Milieu">Milieu</option>
      <option value="Attaquant">Attaquant</option>
    </select>
  </div>
  <div class="grid grid-4" id="players-grid">Chargement…</div>
</main>

<footer>Plateforme de gestion — Coupe du Monde FIFA 2026™</footer>

<script src="js/api.js"></script>
<script>
renderHeader('equipes.html');
const teamId = new URLSearchParams(window.location.search).get('id');
let joueursCache = [];

async function chargerEquipe() {
  if (!teamId) { document.getElementById('team-header').innerHTML = '<div class="card">Équipe introuvable.</div>'; return; }
  try {
    const team = await apiFetch(`/teams/${teamId}`);
    document.getElementById('team-header').innerHTML = `
      <div class="eyebrow-free">Groupe ${team.groupe}</div>
      <h1 style="font-family:var(--font-display); font-size:40px; margin:6px 0;">${team.nom}</h1>
      <p style="color:var(--gris);">${team.entraineur ? 'Sélectionneur : ' + team.entraineur.nom : "Sélectionneur non renseigné."}</p>
    `;
    joueursCache = team.joueurs || [];
    afficherJoueurs();
  } catch (e) {
    document.getElementById('team-header').innerHTML = '<div class="card">Impossible de charger cette équipe.</div>';
  }
}

function afficherJoueurs() {
  const poste = document.getElementById('filtre-poste').value;
  const filtres = poste ? joueursCache.filter(j => j.poste === poste) : joueursCache;
  const grid = document.getElementById('players-grid');
  grid.innerHTML = filtres.length ? filtres.map(j => `
    <div class="card">
      <div style="font-size:12px;color:var(--gris);">${j.poste}${j.numero ? ' · n°' + j.numero : ''}</div>
      <div style="font-weight:700; margin:6px 0;">${j.nom}</div>
    </div>
  `).join('') : '<div class="card">Aucun joueur pour ce filtre.</div>';
}

document.getElementById('filtre-poste').addEventListener('change', afficherJoueurs);
chargerEquipe();
</script>
</body>
</html>
